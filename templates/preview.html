{% extends 'base.html' %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h2 class="title" style="margin-bottom: 0;">Previsualización de Gráfico</h2>
    <button onclick="window.close()" class="btn btn-secondary">Cerrar</button>
</div>

<div class="glass-panel" style="padding: 2rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2rem;">
    {% if image_filename %}
        <img src="{{ url_for('serve_image', filename=image_filename) }}" style="max-width: 100%; max-height: 70vh; border: 2px solid var(--primary); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <a href="{{ url_for('download_image', filename=image_filename) }}" class="btn" style="background-color: var(--success); font-size: 1.2rem; padding: 1rem 3rem;">Descargar PNG</a>
    {% else %}
        <p style="color: var(--danger);">No se pudo generar el gráfico.</p>
    {% endif %}
</div>
{% endblock %}
