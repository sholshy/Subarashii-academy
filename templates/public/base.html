<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Duelorapido.cl - Subarashii Academy{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='public/css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">DUELORAPIDO<span>.CL</span></a>
            <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" onclick="toggleMobileNav()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="/ranking">Ranking</a>
                <a href="/temporadas">Temporadas</a>
                <a href="/calendario">Calendario</a>
                <a href="/logros">Logros</a>
                <a href="/hall-of-fame">Hall of Fame</a>
                <a href="/unirse" class="nav-live-pill">📱 Sala en Vivo</a>
            </div>
        </div>
    </nav>
    <script>
        function toggleMobileNav() {
            const links = document.getElementById('navLinks');
            const toggle = document.getElementById('navToggle');
            if (links && toggle) {
                links.classList.toggle('nav-open');
                toggle.classList.toggle('active');
            }
        }
        // Cerrar menú al hacer clic en un enlace en móviles
        document.addEventListener('DOMContentLoaded', function() {
            const links = document.querySelectorAll('.nav-links a');
            links.forEach(l => {
                l.addEventListener('click', () => {
                    const nav = document.getElementById('navLinks');
                    const toggle = document.getElementById('navToggle');
                    if (nav && nav.classList.contains('nav-open')) {
                        nav.classList.remove('nav-open');
                        if (toggle) toggle.classList.remove('active');
                    }
                });
            });
        });
    </script>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2026 Duelorapido.cl & Subarashii Duel Academy</p>
    </footer>
</body>
</html>
