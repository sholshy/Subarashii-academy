{% extends 'base.html' %}

{% block title %}Crear Carta e Impresión Manual - Subarashii{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <h1 class="text-2xl font-black text-slate-100">Crear Carta e Impresión Manual</h1>
        <a href="{% url 'catalog_list' %}" class="text-sm text-slate-400 hover:text-slate-200">&larr; Volver</a>
    </div>

    <form method="post" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
        {% csrf_token %}

        <div class="border-b border-slate-800 pb-4">
            <h2 class="text-base font-bold text-amber-400 mb-4">1. Datos de la Carta Base</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Nombre de la Carta *</label>
                    <input type="text" name="name" required placeholder="Ej: Mago Oscuro" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Tipo de Carta</label>
                        <input type="text" name="card_type" placeholder="Ej: Normal Monster, Spell Card..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Raza / Tipo</label>
                        <input type="text" name="race" placeholder="Ej: Spellcaster, Dragon..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Atributo</label>
                        <input type="text" name="attribute" placeholder="DARK, LIGHT..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-300 mb-1">ATK</label>
                        <input type="number" name="atk" placeholder="2500" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-300 mb-1">DEF</label>
                        <input type="number" name="def_points" placeholder="2100" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Efecto / Descripción</label>
                    <textarea name="description" rows="3" placeholder="Texto o descripción oficial de la carta..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none"></textarea>
                </div>
            </div>
        </div>

        <div>
            <h2 class="text-base font-bold text-emerald-400 mb-4">2. Datos de la Impresión Inicial</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Código de Impresión *</label>
                        <input type="text" name="print_code" required placeholder="Ej: LOB-005 o RA01-ES001" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Nombre de la Expansión *</label>
                        <input type="text" name="set_name" required placeholder="Ej: Legend of Blue Eyes White Dragon" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Rareza *</label>
                        <input type="text" name="rarity" required placeholder="Ultra Rare, Common..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Edición</label>
                        <select name="edition" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
                            {% for code, label in editions %}
                                <option value="{{ code }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-300 mb-1">Idioma</label>
                        <select name="language" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
                            {% for code, label in languages %}
                                <option value="{{ code }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-slate-300 mb-1">URL de Imagen (Opcional)</label>
                    <input type="url" name="image_url" placeholder="https://..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
                </div>
            </div>
        </div>

        <div class="pt-4 flex justify-end gap-3">
            <a href="{% url 'catalog_list' %}" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-sm rounded-xl">Cancelar</a>
            <button type="submit" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-sm rounded-xl shadow-lg shadow-amber-500/20">
                Guardar Carta e Impresión
            </button>
        </div>
    </form>
</div>
{% endblock %}
