services:
  db:
    image: postgres:17-alpine
    container_name: subarashii_postgres
    restart: always
    environment:
      POSTGRES_DB: subarashii_showcase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: subarashii_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: subarashii_showcase_web
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=True
      - SECRET_KEY=docker_compose_dev_key_subarashii_2026
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=subarashii_showcase
      - DB_USER=postgres
      - DB_PASSWORD=postgres_dev_secret_2026
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  celery_worker:
    build: .
    container_name: subarashii_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=subarashii_showcase
      - DB_USER=postgres
      - DB_PASSWORD=postgres_dev_secret_2026
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: subarashii_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=subarashii_showcase
      - DB_USER=postgres
      - DB_PASSWORD=postgres_dev_secret_2026
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: subarashii_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
